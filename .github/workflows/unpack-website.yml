name: Unpack website zip
on:
  push:
    branches: [main]
    paths: ['office-werkstatt-website*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site into docs/ and remove the zip
        run: |
          shopt -s nullglob
          for z in office-werkstatt-website*.zip; do
            unzip -o "$z"
            git rm -q "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update Office Werkstatt website (docs/)"
          git push
