name: Unpack website zip
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unpack-website.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site into docs/ and remove the zip
        run: |
          unzip -o office-werkstatt-website_1.zip
          git rm -q office-werkstatt-website_1.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Add Office Werkstatt website (docs/)"
          git push
