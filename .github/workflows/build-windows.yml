# Office Werkstatt – builds the Windows offline installer with everything inside:
# the Werkzeug engines and the built-in AI engine (llama.cpp).
# Runs by hand (Actions › Build Windows installer › Run workflow) and for every published release
# (the installer is then attached to that release).
name: Build Windows installer
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tools (NSIS)
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Dependencies
        working-directory: desktop
        run: npm ci
      - name: Installer (engines + AI engine)
        working-directory: desktop
        run: node build/win-pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Office-Werkstatt-Setup
          path: desktop/dist/*.exe
          retention-days: 14
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/dist/*.exe --clobber
