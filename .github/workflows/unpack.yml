name: Unpack ow-update.zip
on:
  push:
    paths: ['ow-update.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ow-update.zip
          git rm -q ow-update.zip .github/workflows/unpack.yml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Office Werkstatt 1.3.2: folders, one theme switch, engine search"
          git push
