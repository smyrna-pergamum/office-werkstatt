name: Unpack design-werkzeug.zip
on:
  push:
    paths: ['design-werkzeug.zip', '.github/workflows/unpack-upload.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded zip into the repository and remove it
        run: |
          [ -f design-werkzeug.zip ] || exit 0
          unzip -o -q design-werkzeug.zip -d /tmp/u
          S=/tmp/u/design-werkzeug
          cp -r "$S/README.md" "$S/docs" "$S/public" "$S/server" .
          git rm -q design-werkzeug.zip .github/workflows/unpack-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Design Werkzeug: Canva-style design studio (unpacked from upload)"
          git push
