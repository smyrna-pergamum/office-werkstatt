# Office Werkstatt – server (team / intranet)
#   docker compose up -d        then open http://<server>:8080/setup and create the administrator
#   (the setup code: docker compose logs office-werkstatt)
# Over the internet use HTTPS: deploy/docker-compose.https.yml (automatic certificate).
services:
  office-werkstatt:
    image: ghcr.io/smyrna-pergamum/office-werkstatt:latest
    # build: .                     # or build the image from this folder instead
    ports: ["8080:8080"]
    volumes: ["office-werkstatt:/data"]
    environment:
      # optional – instead of the setup page: OW_USER / OW_PASS become an administrator account
      # OW_USER: admin
      # OW_PASS: a-long-password
      OW_BACKUP_HOURS: 24
    restart: unless-stopped
volumes:
  office-werkstatt:
