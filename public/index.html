<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Werkstatt</title>
<meta name="description" content="Office Werkstatt – integrated offline office suite: documents, spreadsheets, slides, notes, drawings and PDF.">
<meta name="theme-color" content="#6B5CF0">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editors.css">
<script>
  /* apply theme before paint – no flash */
  (function () { try { var t = localStorage.getItem('ow-theme') || 'system';
    var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {} })();
</script>
</head>
<body>
<div id="app" class="app">
  <!-- ========== Sidebar ========== -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/home" aria-label="Office Werkstatt">
      <img src="assets/logo.svg" alt="" width="38" height="38">
      <span class="brand-name">Office <b>Werkstatt</b></span>
    </a>
    <button class="btn-create" id="btnCreate"><span data-icon="plus"></span><span data-i18n="new"></span></button>
    <nav class="nav" id="nav">
      <a href="#/home" data-route="home"><span data-icon="home"></span><span data-i18n="nav.dashboard"></span></a>
      <a href="#/recent" data-route="recent"><span data-icon="clock"></span><span data-i18n="nav.recent"></span></a>
      <a href="#/files" data-route="files"><span data-icon="folder"></span><span data-i18n="nav.files"></span></a>
      <a href="#/templates" data-route="templates"><span data-icon="grid"></span><span data-i18n="nav.templates"></span></a>
      <a href="#/shared" data-route="shared"><span data-icon="users"></span><span data-i18n="nav.shared"></span></a>
      <a href="#/favorites" data-route="favorites"><span data-icon="star"></span><span data-i18n="nav.favorites"></span></a>
      <a href="#/trash" data-route="trash"><span data-icon="trash"></span><span data-i18n="nav.trash"></span><span class="count" id="trashCount"></span></a>
      <div class="nav-sep"></div>
      <a href="#/admin" data-route="admin" id="navAdmin" hidden><span data-icon="gauge"></span><span data-i18n="nav.admin"></span></a>
      <a href="#/settings" data-route="settings"><span data-icon="settings"></span><span data-i18n="nav.settings"></span></a>
    </nav>
    <div class="side-foot">
      <div class="storage-pill" id="storagePill"></div>
      <div class="offline-pill" id="netPill"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ========== Main ========== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="Menu"><span data-icon="menu"></span></button>
      <button class="searchbox" id="btnSearch">
        <span data-icon="search"></span><span class="ph" data-i18n="search.placeholder"></span><kbd>Ctrl + K</kbd>
      </button>
      <div class="top-actions">
        <button class="ai-top" id="btnAI" data-i18n-title="ai.open"><span data-icon="sparkle"></span><span data-i18n="ai.button"></span></button>
        <div class="lang-switch" id="langSwitch"></div>
        <button class="icon-btn" id="btnTheme" data-i18n-title="theme.toggle"><span data-icon="moon"></span></button>
        <button class="icon-btn has-dot" id="btnBell" data-i18n-title="notifications"><span data-icon="bell"></span></button>
        <button class="avatar" id="btnUser" aria-label="User"><span data-icon="user"></span></button>
      </div>
    </header>
    <main class="views" id="views">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-list"></section>
      <section class="view" id="view-templates"></section>
      <section class="view" id="view-settings"></section>
      <section class="view" id="view-admin"></section>
    </main>
  </div>
</div>

<!-- full-screen editor host -->
<div class="editor-host" id="editorHost" hidden></div>

<!-- drag & drop overlay -->
<div class="drop-overlay" id="dropOverlay" hidden>
  <div class="drop-card"><span data-icon="upload"></span><h2 data-i18n="drop.title"></h2><p data-i18n="drop.hint"></p></div>
</div>
<input type="file" id="filePicker" multiple hidden accept=".docx,.docm,.dotx,.dotm,.doc,.dot,.odt,.ott,.fodt,.rtf,.txt,.md,.markdown,.html,.htm,.xml,.xlsx,.xlsm,.xltx,.xltm,.xls,.xlsb,.ods,.csv,.tsv,.pptx,.pptm,.ppsx,.ppsm,.potx,.potm,.ppt,.pps,.pot,.odp,.otp,.odg,.fodp,.uop,.xlt,.ots,.fods,.uos,.uot,.wps,.werkzeug,.wordcraft,.gridcraft,.deckcraft,.pdf,.excalidraw,.json,.owdoc,image/*">

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div class="toasts" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/sanitize.js"></script>
<script src="js/desktop.js"></script>
<script src="js/zip.js"></script>
<script src="js/legacy-ppt.js"></script>
<script src="js/odf.js"></script>
<script src="js/templates.js"></script>
<script src="js/editor-shell.js"></script>
<script src="js/editors/word.js"></script>
<script src="js/editors/excel.js"></script>
<script src="js/editors/slide.js"></script>
<script src="js/editors/note.js"></script>
<script src="js/editors/note-calendar.js"></script>
<script src="js/editors/draw.js"></script>
<script src="js/editors/pdf.js"></script>
<script src="js/editors/pro.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/form-core.js"></script>
<script src="js/editors/form.js"></script>
<script src="js/design-core.js"></script>
<script src="js/stock-core.js"></script>
<script src="js/editors/design-strings.js"></script>
<script src="js/editors/design.js"></script>
<script src="js/ai-strings.js"></script>
<script src="js/agent-bridge.js"></script>
<script src="js/ai.js"></script>
<script src="js/editors/ai.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
